{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Django Blog</title>
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>

<body>
    <!-- Dark Mode Toggle Button -->
    <button id="dark-mode-toggle" class="btn btn-dark position-fixed bottom-0 end-0 m-4" onclick="toggleDarkMode()" >
        <i class="bi bi-moon-stars"></i> Dark Mode
    </button>

    <nav class="navbar navbar-expand-lg navbar-dark  py-3">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="/"> Blog</a>
            <a href="{% url 'post_new' %}" class="btn btn-light">+ New Post</a>
        </div>
    </nav>

    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            let darkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', darkMode);
        }

        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>

</html>
