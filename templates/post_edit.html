{% extends 'base.html' %}

{% block content %}
<h1>New post</h1>
<form method="POST" class="post-form">
    {% csrf_token%}
    {{ form.as_p }}
    
    <button type="submit" class="save btn btn-default">Save</button>
</form>
    {% if post.pk %}
    <a href="{% url 'post_delete' pk=post.pk %}" class="btn btn-danger">
        Delete
    </a>
    {% endif %}


{% endblock %}
